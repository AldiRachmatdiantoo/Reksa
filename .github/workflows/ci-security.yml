# REKSA CI & security gate (PRD §11).
# Wajib hijau sebelum pull request di-merge ke main.

name: CI & Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend-quality:
    name: Backend · typecheck, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-integration:
    name: Backend · integration & security tests (Testcontainers)
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Menyalakan PostgreSQL & Redis asli lewat Docker bawaan runner.
      - run: npm run test:integration

  dependency-audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit backend
        working-directory: backend
        run: npm audit --audit-level=high
      - name: npm audit frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm audit --audit-level=high

  semgrep:
    name: SAST · Semgrep (OWASP Top 10, TypeScript, Node.js, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/typescript
          --config p/nodejs
          --config p/secrets
          --metrics=off
          --error

  docker-build:
    name: Docker · build images
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build backend runner image
        run: docker build --target runner -t reksa-backend:ci backend
      - name: Build migrator image
        run: docker build --target migrator -t reksa-migrate:ci backend
      - name: Verify backend image runs as non-root
        run: test "$(docker run --rm --entrypoint id reksa-backend:ci -u)" != "0"
      - name: Build frontend image
        if: hashFiles('frontend/package.json') != ''
        run: docker build -t reksa-frontend:ci frontend
      - name: Validate nginx config
        run: >-
          docker run --rm --add-host backend:127.0.0.1
          -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:stable-alpine nginx -t

  frontend:
    # Nama job jangan diubah: "Frontend · build" terdaftar sebagai required check di ruleset main.
    name: Frontend · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect frontend scaffold
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json belum ada; job frontend dilewati."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm test
      - if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  # Stack lengkap (nginx + backend + worker + Postgres + Redis + S3) persis seperti
  # produksi lokal, lalu Playwright + axe. Menangkap bug yang hanya muncul di build
  # produksi di balik nginx (CSP, navigasi), bukan di `npm run dev`.
  e2e:
    name: E2E · Playwright + axe (Docker stack)
    needs: frontend
    # Dikunci ke 24.04: ubuntu-latest sudah 26.04 dan Playwright 1.59 belum mendukungnya
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Naikkan setelah
    # Playwright mendukung 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway .env
        # Setiap CHANGE_ME diganti rahasia acak sekali pakai; stack hanya hidup selama job.
        run: |
          while IFS= read -r line; do
            if [[ "$line" == *=CHANGE_ME ]]; then
              echo "${line%CHANGE_ME}$(openssl rand -hex 24)"
            else
              echo "$line"
            fi
          done < .env.example > .env
      - name: Start database and cache
        run: docker compose up -d --wait postgres redis
      - name: Run migrations
        run: docker compose --profile tools run --rm --build migrate
      - name: Start full stack
        run: docker compose up -d --build --wait backend frontend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 backend frontend

# Reverse proxy + static server untuk REKSA (dipasang sebagai conf.d/default.conf
# di image nginxinc/nginx-unprivileged, berjalan sebagai non-root di port 8080).
#
# TLS: di lingkungan staging/produksi, HTTPS diterminasi di depan container ini
# (load balancer / Cloudflare). Di lokal, Chrome & Firefox memperlakukan
# http://localhost sebagai secure context, jadi cookie Secure/__Host- tetap jalan.

# Header keamanan untuk halaman SPA. Respons /api/ sudah diberi header oleh helmet
# di backend (backend/src/app.ts), jadi di sini dikosongkan agar tidak dobel.
# style-src memuat hash <style> bawaan @number-flow/react (timer dan skor). Hash ini
# ikut berubah kalau versi NumberFlow diganti: cek konsol browser setelah upgrade.
map $uri $reksa_csp {
    ~^/api/ "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-UuQYRYONhO98Tat6WCmWkHuzLFspkqHldG3mlbjHAo4='; img-src 'self' data: blob: https: http://localhost:8333; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-src http://localhost:8333 https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}
map $uri $reksa_xfo      { ~^/api/ ""; default "DENY"; }
map $uri $reksa_nosniff  { ~^/api/ ""; default "nosniff"; }
map $uri $reksa_referrer { ~^/api/ ""; default "no-referrer"; }
map $uri $reksa_coop     { ~^/api/ ""; default "same-origin"; }
map $uri $reksa_hsts     { ~^/api/ ""; default "max-age=31536000; includeSubDomains"; }

upstream reksa_backend {
    server backend:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security headers ----------
    # Catatan: blok `location` yang memakai add_header sendiri TIDAK mewarisi
    # header di bawah ini. Hindari add_header di dalam location.
    # Header yang juga dipasang helmet di backend dikosongkan untuk /api/ (lihat map
    # di atas; add_header dengan nilai kosong tidak mengirim header), jadi respons API
    # tidak membawa dua CSP atau X-Frame-Options yang saling bertentangan.
    add_header Content-Security-Policy $reksa_csp always;
    add_header X-Frame-Options $reksa_xfo always;
    add_header X-Content-Type-Options $reksa_nosniff always;
    add_header Referrer-Policy $reksa_referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy $reksa_coop always;
    add_header Strict-Transport-Security $reksa_hsts always;

    # ---------- Kompresi ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Batas default kecil; upload dibuka khusus di location masing-masing.
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---------- API ----------
    # Host diisi nilai tetap: header Host dari klien bisa dipalsukan dan backend
    # tidak membutuhkannya (CORS memakai Origin, bukan Host).
    location /api/ {
        proxy_pass http://reksa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host reksa-backend;
        proxy_set_header X-Real-IP $remote_addr;
        # Ganti (bukan tambah) X-Forwarded-For agar klien tidak bisa memalsukan IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Upload materi PDF (maks 10 MB) dan foto esai (maks 5 MB).
    location = /api/v1/materials {
        client_max_body_size 11m;
        proxy_pass http://reksa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host reksa-backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/v1/scans/upload {
        client_max_body_size 6m;
        proxy_pass http://reksa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host reksa-backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SSE untuk QR bridge (FR-04): jangan di-buffer.
    # Path ini usulan awal; sesuaikan dengan endpoint final dari Adli (essay-scans).
    location ~ ^/api/v1/scans/qr-bridge/[A-Za-z0-9_-]+/events$ {
        proxy_pass http://reksa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host reksa-backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
    }

    # ---------- Aset statis ----------
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# REKSA: orkestrasi lokal / staging.
#
#   cp .env.example .env            # isi semua CHANGE_ME
#   docker compose up -d postgres redis
#   docker compose --profile tools run --rm migrate
#   docker compose up -d --build
#
# Jaringan:
#   internal_net : internal: true, tanpa akses keluar. postgres + redis hanya di sini.
#   app_net      : jaringan bridge biasa. frontend (nginx) + backend + storage.
#                  Backend butuh akses keluar untuk Gemini (Fase 3), tetapi tidak
#                  mem-publish port apa pun. Port yang terbuka ke host hanya di
#                  127.0.0.1: nginx (8080) dan S3 storage (8333).
#
# Storage: SeaweedFS (S3-compatible) menggantikan Supabase Storage secara lokal.
# Port 8333 di-publish karena browser mengambil file langsung lewat signed URL
# (tanpa signature, bucket menolak dengan 403). Di produksi endpoint-nya adalah
# S3 endpoint Supabase Storage; lihat README bagian Deploy.

name: reksa

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reksa
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-reksa_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD wajib diisi di .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD wajib diisi di .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Jalankan manual: docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: migrator
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_OWNER_USER:-reksa_owner}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/reksa
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  # S3-compatible lokal. Kredensial dari .env ditulis ke /tmp (tmpfs) saat start.
  storage:
    <<: *hardening
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    user: "1000:1000"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        printf '{"identities":[{"name":"reksa-backend","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging","Admin"]}]}'           "$$STORAGE_ACCESS_KEY_ID" "$$STORAGE_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec /usr/bin/weed -logtostderr=true server -dir=/data -s3 -s3.config=/tmp/s3.json -ip.bind=0.0.0.0
    environment:
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID wajib diisi di .env}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY wajib diisi di .env}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storagedata:/data
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=1000
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Membuat bucket privat sekali (idempoten), lalu selesai.
  storage-init:
    <<: *hardening
    image: chrislusf/seaweedfs:4.54
    user: "1000:1000"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "s3.bucket.create -name $$STORAGE_BUCKET" | /usr/bin/weed shell -master=storage:9333 2>&1 | tee /tmp/out
        if grep -qi error /tmp/out && ! grep -qi "already exist" /tmp/out; then exit 1; fi
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-reksa-private}
    tmpfs:
      - /tmp:size=8m,mode=1777
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - app_net

  # Menangkap semua email dari backend tanpa mengirimnya (FR-14). Kotak masuk: http://localhost:8025
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - app_net

  backend:
    <<: *hardening
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://app_service_user:${APP_DB_PASSWORD}@postgres:5432/reksa
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET wajib diisi di .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET wajib diisi di .env}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-mock}
      MOCK_AI_LATENCY_MS: ${MOCK_AI_LATENCY_MS:-300}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STORAGE_ENDPOINT: http://storage:8333
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:8333}
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:-reksa-private}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_FORCE_PATH_STYLE: "true"
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      EMAIL_FROM: ${EMAIL_FROM:-REKSA <no-reply@reksa.local>}
      APP_URL: ${APP_URL:-http://localhost:8080}
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - internal_net
      - app_net

  frontend:
    <<: *hardening
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net

networks:
  internal_net:
    internal: true
  app_net: {}

volumes:
  pgdata:
  redisdata:
  storagedata:
